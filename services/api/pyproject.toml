[project]
name = "qosthub-api"
version = "0.1.0"
description = "QostHubHack API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn>=0.34,<1.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "httpx2==2.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
