name: qosthub

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: qosthub_demo
      POSTGRES_USER: qosthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qosthub -d qosthub_demo"]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host db in root .env}
    command: ["/workspace/services/api/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host db in root .env}
      PHOTO_STORAGE_PATH: /workspace/data/photos
      FORWARDED_ALLOW_IPS: 172.30.42.10
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - photo_data:/workspace/data/photos
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/workspace/services/api/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.42.10
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  photo_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.42.0/24
