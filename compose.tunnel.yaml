# Opt-in Quick Tunnel: cloudflared on the host forwards to 127.0.0.1:5173.
services:
  api:
    environment:
      PUBLIC_BASE_URL: https://${TUNNEL_HOSTNAME:?Set TUNNEL_HOSTNAME without scheme or path}
      SESSION_COOKIE_SECURE: "true"
  worker:
    environment:
      PUBLIC_BASE_URL: https://${TUNNEL_HOSTNAME}
      SESSION_COOKIE_SECURE: "true"
  ai-worker:
    # Base Compose retains the keyless CI worker; the tunnel excludes it by default.
    profiles: ["unbudgeted-ai"]
    environment:
      OPENAI_API_KEY: ""
      PUBLIC_BASE_URL: https://${TUNNEL_HOSTNAME}
      SESSION_COOKIE_SECURE: "true"
  web:
    environment:
      TUNNEL_HOSTNAME: ${TUNNEL_HOSTNAME}
      NGINX_ENVSUBST_FILTER: "^TUNNEL_HOSTNAME$"
    volumes:
      - ./infra/nginx.tunnel.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header=Host: ${TUNNEL_HOSTNAME}", "http://127.0.0.1/"]
  ai-demo-worker:
    profiles: ["live-ai"]
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host db}
      PHOTO_STORAGE_PATH: /workspace/data/photos
      PUBLIC_BASE_URL: https://${TUNNEL_HOSTNAME}
      SESSION_COOKIE_SECURE: "true"
    # Stop the ordinary ai-worker before explicitly enabling this profile.
    # The entrypoint refuses missing/exhausted/unresolved ledgers; it never creates a budget.
    command: ["/workspace/services/api/.venv/bin/python", "/workspace/infra/native_runtime.py", "--existing-budget-worker", "--ledger", "/workspace/data/live-budget/budget.json", "--budget-usd", "10"]
    volumes:
      - photo_data:/workspace/data/photos:ro
      - ./infra/native_runtime.py:/workspace/infra/native_runtime.py:ro
      - type: bind
        source: ${LIVE_AI_LEDGER_DIR:?Set LIVE_AI_LEDGER_DIR to the existing authorized budget directory}
        target: /workspace/data/live-budget
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  seed-demo:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host db}
      PHOTO_STORAGE_PATH: /workspace/data/photos
    command: ["/workspace/services/api/.venv/bin/python", "-m", "app.seed_demo", "--seed", "42", "--as-of", "${DEMO_AS_OF:?Set DEMO_AS_OF to the demonstration day}"]
    volumes:
      - ./data/demo:/workspace/data/demo:ro
      - photo_data:/workspace/data/photos
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
